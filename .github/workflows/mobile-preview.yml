name: Mobile preview
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: mobile
      - run: npm run platforms && npm test && npx cap sync android
        working-directory: mobile
      - run: bash gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-preview
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm run platforms && npm test && npx cap sync ios
        working-directory: mobile
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-preview
          path: mobile/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7

  ui-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm run build
        working-directory: mobile
      - run: npx playwright install --with-deps chromium && npm run test:ui
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-review
          path: mobile/qa/
          if-no-files-found: error
          retention-days: 7
